[package]
name = "microloop-semantic"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Semantic similarity sidecar for Microloop — catches agents stuck in semantic loops"
repository = "https://github.com/Devaretanmay/microloop"
homepage = "https://github.com/Devaretanmay/microloop"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.13.4", features = ["json"] }
candle-core = "0.8.2"
candle-nn = "0.8.2"
candle-transformers = "0.8.2"
hf-hub = "0.4.1"
tokenizers = "0.21.0"
anyhow = "1.0.95"
