[package]
name = "microloop-proxy"
version = "0.1.1"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
microloop = { path = "../../" }
