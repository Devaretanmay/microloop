[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "microloop"
version = "0.1.7"
description = "Ultra-fast runtime safety layer for autonomous agents — detects agent tool call loops before they burn API credits"
authors = [{ name = "Microloop Team" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.8"
homepage = "https://github.com/Devaretanmay/microloop"
repository = "https://github.com/Devaretanmay/microloop"
keywords = ["agent", "llm", "guardrail", "safety", "loop-detection"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]

[project.optional-dependencies]
litellm = ["litellm>=1.0.0"]
crewai  = ["crewai>=0.105.0"]
aider   = ["aider-chat>=0.50.0"]

[project.scripts]
ml = "microloop.cli:run_cli"
microloop = "microloop.cli:run_tui"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "microloop.microloop_core"
