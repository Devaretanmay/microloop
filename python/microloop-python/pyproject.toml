[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "microloop"
version = "0.1.1"
description = "Ultra-fast runtime safety layer for autonomous agents"
authors = [{ name = "Microloop Team" }]
license = "Apache-2.0"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "microloop.microloop_core"
